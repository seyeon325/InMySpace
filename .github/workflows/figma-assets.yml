name: 피그마 이미지 에셋 받기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/figma-assets.json
      - .github/workflows/figma-assets.yml

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run build
      - name: 이미지 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/figma
          if git diff --cached --quiet; then
            echo "새 이미지 없음"
          else
            git commit -m "피그마 이미지 에셋 추가"
            git push
          fi
